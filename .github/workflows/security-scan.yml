name: Security Scanning & CVE Vulnerability Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly security scan every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  trivy-repo-scan:
    name: Trivy Filesystem & Secret Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Trivy Binary
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Trivy Vulnerability Scanner (Repo & Configs)
        run: |
          trivy fs --severity CRITICAL,HIGH --exit-code 0 --ignore-unfixed .

  seccomp-validator:
    name: Seccomp Profile Structure & Syscall Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Seccomp Profiles
        run: |
          python -c "
          import json, os
          profiles = ['docker/python/seccomp-profile.json', 'docker/compiler/seccomp-profile.json']
          for p in profiles:
              if os.path.exists(p):
                  with open(p) as f:
                      data = json.load(f)
                      assert data.get('defaultAction') in ['SCMP_ACT_ERRNO', 'SCMP_ACT_KILL'], f'Insecure default action in {p}'
                      print(f'Verified valid Seccomp profile: {p}')
          "
