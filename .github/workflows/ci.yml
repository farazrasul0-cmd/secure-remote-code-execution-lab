name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint, Formatting & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r worker/requirements.txt

      - name: Run Ruff Linter & Formatter Check
        run: |
          python -m ruff check backend/ worker/
          python -m ruff format --check backend/ worker/

      - name: Run Full Pytest Suite with Coverage
        run: |
          pytest backend/tests -v --durations=10 --cov=backend/app --cov=worker --cov-report=term-missing

  frontend-quality:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install npm dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck TypeScript
        working-directory: ./frontend
        run: npm run typecheck || npx tsc --noEmit

      - name: Production Vite Build
        working-directory: ./frontend
        run: npm run build

  helm-lint:
    name: Helm Chart Lint & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Helm Chart
        run: |
          helm lint ./helm/rce-platform
          helm template rce-test ./helm/rce-platform > /dev/null
