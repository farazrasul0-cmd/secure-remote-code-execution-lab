# -- Application Configuration ------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rce-platform.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "rce-platform.labels" . | nindent 4 }}
data:
  DATABASE_URL: {{ .Values.backend.env.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.backend.env.REDIS_URL | quote }}
  JWT_ALGORITHM: {{ .Values.backend.env.JWT_ALGORITHM | quote }}
  JWT_EXPIRATION_MINUTES: {{ .Values.backend.env.JWT_EXPIRATION_MINUTES | quote }}
  WORKER_CONCURRENCY: {{ .Values.worker.env.WORKER_CONCURRENCY | quote }}
  EXECUTION_TIMEOUT_SECONDS: {{ .Values.worker.env.EXECUTION_TIMEOUT_SECONDS | quote }}
  MEMORY_LIMIT_MB: {{ .Values.worker.env.MEMORY_LIMIT_MB | quote }}
