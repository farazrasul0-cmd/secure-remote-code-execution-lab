{{- if .Values.autoscaling.worker.enabled }}
# -- Worker HPA (Custom Queue Depth Metric via Prometheus) ---------------------
# Scales Celery workers based on Redis queue depth (pending submissions),
# implementing Little's Law: Replicas = ceil(QueueDepth / TargetPerWorker)
#
# Prerequisites:
#   1. Prometheus Adapter or KEDA installed in cluster
#   2. Custom metric "rce_worker_queue_depth" registered in Prometheus
#   3. Custom Metrics API server (custom.metrics.k8s.io) available
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rce-platform.fullname" . }}-worker-hpa
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "rce-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rce-platform.fullname" . }}-worker
  minReplicas: {{ .Values.autoscaling.worker.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.worker.maxReplicas }}
  metrics:
    # Primary: Queue depth custom metric (submissions pending per worker pod)
    - type: Pods
      pods:
        metric:
          name: rce_worker_queue_depth
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.worker.targetQueueDepthPerWorker | quote }}
    # Fallback: CPU utilization as safety net
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Prevent flapping: wait 5 minutes before scaling down
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # Rapid burst response: scale up immediately on queue backlog
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
{{- end }}
