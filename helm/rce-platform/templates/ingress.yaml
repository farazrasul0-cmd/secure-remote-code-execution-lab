{{- if .Values.ingress.enabled }}
# -- Ingress with WebSocket Upgrade & Path-Based Routing ----------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rce-platform.fullname" . }}-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "rce-platform.labels" . | nindent 4 }}
  annotations:
    {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # API routes -> Backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "rce-platform.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          # WebSocket routes -> Backend
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "rce-platform.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
          # All other routes -> Frontend SPA
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rce-platform.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
