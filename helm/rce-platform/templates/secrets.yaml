# -- Sensitive Credentials (base64-encoded) -----------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rce-platform.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "rce-platform.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET_KEY: {{ .Values.backend.env.JWT_SECRET_KEY | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.env.POSTGRES_PASSWORD | b64enc | quote }}
