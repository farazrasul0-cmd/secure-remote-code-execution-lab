# -- Backend ClusterIP Service -------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rce-platform.fullname" . }}-backend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "rce-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "rce-platform.name" . }}
    app.kubernetes.io/component: backend
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
