version: "3.8"

# ==============================================================================
# Production Docker Compose Orchestration
# Secure Real-Time Remote Code Execution Laboratory Platform
# ==============================================================================

services:
  # Ingress Reverse Proxy & Load Balancer
  nginx:
    image: nginx:1.27-alpine
    container_name: rce_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - rce_public_network
      - rce_internal_network

  # Frontend SPA Service (Nginx Alpine + Compiled React 18 Assets)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: rce_frontend_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - rce_internal_network

  # Backend API Gateway Service (FastAPI + Asyncpg + Prometheus)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: rce_backend_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - PROJECT_NAME=Secure Remote Code Execution Lab
      - API_V1_STR=/api/v1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - RATE_LIMIT_SUBMISSIONS_PER_MINUTE=${RATE_LIMIT_SUBMISSIONS_PER_MINUTE:-15}
      - RATE_LIMIT_LOGIN_PER_MINUTE=${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rce_internal_network

  # Asynchronous Compute Execution Worker Service (Celery + Docker SDK)
  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    container_name: rce_worker_prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - CELERY_CONCURRENCY=4
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - rce_internal_network

  # Relational Database Service (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: rce_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rce_internal_network

  # In-Memory Cache, Message Broker & Pub/Sub Bus (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: rce_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_prod_data:/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rce_internal_network

# ==============================================================================
# Volume Declarations (Persistent Storage)
# ==============================================================================
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

# ==============================================================================
# Network Segregation (Public Ingress vs Private Data Tier)
# ==============================================================================
networks:
  rce_public_network:
    driver: bridge
  rce_internal_network:
    driver: bridge
